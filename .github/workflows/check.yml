name: Vector checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/go-api/go.mod
          cache-dependency-path: apps/go-api/go.sum
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - run: bash scripts/quality/go-tools.sh --install
      - uses: j178/prek-action@v3.1.0
        with:
          prek-version: "0.5.7"
          extra-args: "--all-files --group ci --require-group go"
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: j178/prek-action@v3.1.0
        with:
          prek-version: "0.5.7"
          extra-args: "--all-files --group ci --require-group typescript"
