                    description: 'status_429: Too Many Requests response.'
                "500":
                    $ref: '#/components/responses/InternalServerErrorError'
                    description: 'status_500: Internal Server Error response.'
            security:
                - ApiKeyAuth: []
            summary: List projects (lite)
            tags:
                - workspaces
            x-plane-authentication-classes:
                - plane.api.middleware.api_authentication.APIKeyAuthentication
            x-plane-authority: route-inventory-and-behavior-fixtures
            x-plane-contract-id: GET /api/v1/workspaces/{slug}/projects-lite/
            x-plane-handler: get
            x-plane-permission-classes:
                - plane.app.permissions.project.ProjectBasePermission
            x-plane-view: plane.api.views.project.ProjectListLiteAPIEndpoint
