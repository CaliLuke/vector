    parameters:
        PathCycleID:
            name: cycle_id
            in: path
            required: true
            schema:
                type: string
                format: uuid
        PathProjectID:
            name: project_id
            in: path
            description: Project ID
            required: true
            schema:
                type: string
                format: uuid
        PathSlug:
            name: slug
            in: path
            description: Workspace slug
            required: true
            schema:
                type: string
        QueryCursor:
            name: cursor
            in: query
            description: Pagination cursor for getting next set of results
            schema:
                type: string
        QueryOrderBy:
            name: order_by
            in: query
            description: Field to order results by. Prefix with '-' for descending order
            schema:
                type: string
        QueryPerPage:
            name: per_page
            in: query
            description: 'Number of results per page (default: 20, max: 100)'
            schema:
                type: integer
        QueryStatus:
            name: status
            in: query
            description: Canonical cycle status filter. Takes precedence over cycle_view where supported.
            allowEmptyValue: true
            schema:
                type: string
    headers:
        ContentTypeHeader:
            schema:
                type: string
    responses:
        BadRequestError:
            description: Bad Request response.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/APICycleReadsHTTPErrorResponseBody_bf3110b06f0d3bb0'
        ForbiddenError:
            description: Forbidden response.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/APICycleReadsHTTPErrorResponseBody_bf3110b06f0d3bb0'
        InternalServerErrorError:
            description: Internal Server Error response.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/APICycleReadsHTTPErrorResponseBody_bf3110b06f0d3bb0'
        NotFoundError:
            description: Not Found response.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/APICycleReadsHTTPErrorResponseBody_bf3110b06f0d3bb0'
        TooManyRequestsError:
            description: Too Many Requests response.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/APICycleReadsHTTPErrorResponseBody_bf3110b06f0d3bb0'
        UnauthorizedError:
            description: Unauthorized response.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/APICycleReadsHTTPErrorResponseBody_bf3110b06f0d3bb0'
    securitySchemes:
        ApiKeyAuth:
            type: apiKey
            description: Plane API token authentication.
            name: X-Api-Key
            in: header
tags:
    - name: cycles
    - name: projects
