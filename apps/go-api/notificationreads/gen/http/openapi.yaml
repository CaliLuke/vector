openapi: 3.1.1
info:
    title: Plane Internal Django Migration API
    description: Internal full-server migration schema. Route inventory and behavior fixtures remain authoritative. This artifact does not change the public /api/v1 schema.
    version: 1.0.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
servers:
    - url: http://localhost:80
      description: Default server for Plane Internal Django Migration API
paths:
    /api/workspaces/{slug}/users/notifications/:
        get:
            description: |-
                This enables timezone conversion according
                to the user set timezone
            operationId: get_api_workspaces_by_slug_users_notifications
            parameters:
                - $ref: '#/components/parameters/PathSlug'
                - name: search
                  in: query
                  description: A search term.
                  schema:
                    type: string
                - name: snoozed
                  in: query
                  allowEmptyValue: true
                  schema:
                    type: string
                - name: archived
                  in: query
                  allowEmptyValue: true
                  schema:
                    type: string
                - name: read
                  in: query
                  allowEmptyValue: true
                  schema:
                    type: string
                - name: type
                  in: query
                  allowEmptyValue: true
                  schema:
                    type: string
                - name: mentioned
                  in: query
                  allowEmptyValue: true
                  schema:
                    type: string
                - name: per_page
                  in: query
                  allowEmptyValue: true
                  schema:
                    type: string
                - name: cursor
                  in: query
                  allowEmptyValue: true
                  schema:
                    type: string
                - name: order_by
                  in: query
                  allowEmptyValue: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/NotificationArray'
                                    - $ref: '#/components/schemas/PaginatedNotifications'
                "400":
                    $ref: '#/components/responses/BadRequestError'
                    description: 'status_400: Bad Request response.'
                "401":
                    $ref: '#/components/responses/UnauthorizedError'
                    description: 'status_401: Unauthorized response.'
                "403":
                    $ref: '#/components/responses/ForbiddenError'
                    description: 'status_403: Forbidden response.'
                "404":
                    $ref: '#/components/responses/NotFoundError'
                    description: 'status_404: Not Found response.'
                "405":
                    $ref: '#/components/responses/MethodNotAllowedError'
                    description: 'status_405: Method Not Allowed response.'
                "406":
                    $ref: '#/components/responses/NotAcceptableError'
                    description: 'status_406: Not Acceptable response.'
                "415":
                    $ref: '#/components/responses/UnsupportedMediaTypeError'
                    description: 'status_415: Unsupported Media Type response.'
                "500":
                    $ref: '#/components/responses/InternalServerErrorError'
                    description: 'status_500: Internal Server Error response.'
            security:
                - PlaneSessionCookie: []
            tags:
                - users
            x-plane-authentication-classes:
                - plane.authentication.session.BaseSessionAuthentication
            x-plane-authority: route-inventory-and-behavior-fixtures
            x-plane-contract-id: GET /api/workspaces/{slug}/users/notifications/
            x-plane-handler: list
            x-plane-permission-classes:
                - rest_framework.permissions.IsAuthenticated
            x-plane-view: plane.app.views.notification.base.NotificationViewSet
        x-loom-cors:
            runtime: true
    /api/workspaces/{slug}/users/notifications/{pk}/:
        get:
            description: |-
                This enables timezone conversion according
                to the user set timezone
            operationId: get_api_workspaces_by_slug_users_notifications_by_pk
            parameters:
                - $ref: '#/components/parameters/PathSlug'
                - name: pk
                  in: path
                  required: true
                  schema:
                    type: string
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Notification'
                "400":
                    $ref: '#/components/responses/BadRequestError'
                    description: 'status_400: Bad Request response.'
                "401":
                    $ref: '#/components/responses/UnauthorizedError'
                    description: 'status_401: Unauthorized response.'
                "403":
                    $ref: '#/components/responses/ForbiddenError'
                    description: 'status_403: Forbidden response.'
                "404":
                    $ref: '#/components/responses/NotFoundError'
                    description: 'status_404: Not Found response.'
                "405":
                    $ref: '#/components/responses/MethodNotAllowedError'
                    description: 'status_405: Method Not Allowed response.'
                "406":
                    $ref: '#/components/responses/NotAcceptableError'
                    description: 'status_406: Not Acceptable response.'
                "415":
                    $ref: '#/components/responses/UnsupportedMediaTypeError'
                    description: 'status_415: Unsupported Media Type response.'
                "500":
                    $ref: '#/components/responses/InternalServerErrorError'
                    description: 'status_500: Internal Server Error response.'
            security:
                - PlaneSessionCookie: []
            tags:
                - users
            x-plane-authentication-classes:
                - plane.authentication.session.BaseSessionAuthentication
            x-plane-authority: route-inventory-and-behavior-fixtures
            x-plane-contract-id: GET /api/workspaces/{slug}/users/notifications/{pk}/
            x-plane-handler: retrieve
            x-plane-permission-classes:
                - rest_framework.permissions.IsAuthenticated
            x-plane-view: plane.app.views.notification.base.NotificationViewSet
        x-loom-cors:
            runtime: true
    /api/workspaces/{slug}/users/notifications/unread/:
        get:
            description: |-
                This enables timezone conversion according
                to the user set timezone
            operationId: get_api_workspaces_by_slug_users_notifications_unread
            parameters:
                - $ref: '#/components/parameters/PathSlug'
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnreadCounts'
                "400":
                    $ref: '#/components/responses/BadRequestError'
                    description: 'status_400: Bad Request response.'
                "401":
                    $ref: '#/components/responses/UnauthorizedError'
                    description: 'status_401: Unauthorized response.'
                "403":
                    $ref: '#/components/responses/ForbiddenError'
                    description: 'status_403: Forbidden response.'
                "404":
                    $ref: '#/components/responses/NotFoundError'
                    description: 'status_404: Not Found response.'
                "405":
                    $ref: '#/components/responses/MethodNotAllowedError'
                    description: 'status_405: Method Not Allowed response.'
                "406":
                    $ref: '#/components/responses/NotAcceptableError'
                    description: 'status_406: Not Acceptable response.'
                "415":
                    $ref: '#/components/responses/UnsupportedMediaTypeError'
                    description: 'status_415: Unsupported Media Type response.'
                "500":
                    $ref: '#/components/responses/InternalServerErrorError'
                    description: 'status_500: Internal Server Error response.'
            security:
                - PlaneSessionCookie: []
            tags:
                - users
            x-plane-authentication-classes:
                - plane.authentication.session.BaseSessionAuthentication
            x-plane-authority: route-inventory-and-behavior-fixtures
            x-plane-contract-id: GET /api/workspaces/{slug}/users/notifications/unread/
            x-plane-handler: get
            x-plane-permission-classes:
                - rest_framework.permissions.IsAuthenticated
            x-plane-view: plane.app.views.notification.base.UnreadNotificationEndpoint
        x-loom-cors:
            runtime: true
components:
    schemas:
        Notification:
            type: object
            properties:
                archived_at:
                    anyOf:
                        - type: string
                          format: date-time
                        - type: "null"
                created_at:
                    type: string
                    readOnly: true
                    format: date-time
                created_by:
                    anyOf:
                        - type: string
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                        - type: "null"
                data: {}
                deleted_at:
                    anyOf:
                        - type: string
                          format: date-time
                        - type: "null"
                entity_identifier:
                    anyOf:
                        - type: string
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                        - type: "null"
                entity_name:
                    type: string
                    maxLength: 255
                id:
                    type: string
                    readOnly: true
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                is_inbox_issue:
                    type: boolean
                    readOnly: true
                is_intake_issue:
                    type: boolean
                    readOnly: true
                is_mentioned_notification:
                    type: boolean
                    readOnly: true
                message: {}
                message_html:
                    type: string
                message_stripped:
                    anyOf:
                        - type: string
                        - type: "null"
                project:
                    anyOf:
                        - type: string
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                        - type: "null"
                read_at:
                    anyOf:
                        - type: string
                          format: date-time
                        - type: "null"
                receiver:
                    type: string
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                sender:
                    type: string
                    maxLength: 255
                snoozed_till:
                    anyOf:
                        - type: string
                          format: date-time
                        - type: "null"
                title:
                    type: string
                triggered_by:
                    anyOf:
                        - type: string
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                        - type: "null"
                triggered_by_details:
                    readOnly: true
                    anyOf:
                        - allOf:
                            - $ref: '#/components/schemas/NotificationActor'
                        - type: "null"
                updated_at:
                    title: Last Modified At
                    type: string
                    readOnly: true
                    format: date-time
                updated_by:
                    title: Last Modified By
                    anyOf:
                        - type: string
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                        - type: "null"
                workspace:
                    type: string
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
            required:
                - id
                - created_at
                - updated_at
                - created_by
                - updated_by
                - deleted_at
                - workspace
                - project
                - data
                - entity_identifier
                - entity_name
                - title
                - message
                - message_html
                - message_stripped
                - sender
                - triggered_by
                - receiver
                - read_at
                - snoozed_till
                - archived_at
                - triggered_by_details
        NotificationActor:
            type: object
            properties:
                avatar:
                    type: string
                avatar_url:
                    readOnly: true
                    anyOf:
                        - type: string
                        - type: "null"
                display_name:
                    type: string
                    maxLength: 255
                first_name:
                    type: string
                    maxLength: 255
                id:
                    type: string
                    readOnly: true
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                is_bot:
                    type: boolean
                    readOnly: true
                last_name:
                    type: string
                    maxLength: 255
            required:
                - id
                - first_name
                - last_name
                - avatar
                - is_bot
                - display_name
        NotificationArray:
            type: array
            items:
                $ref: '#/components/schemas/Notification'
        NotificationHTTPError_ff189992a65120f5:
            type: object
            properties:
                detail: {}
                error: {}
                snoozed_till: {}
        PaginatedNotifications:
            type: object
            properties:
                count:
                    type: integer
                    format: int64
                extra_stats: {}
                grouped_by: {}
                next_cursor:
                    type: string
                next_page_results:
                    type: boolean
                prev_cursor:
                    type: string
                prev_page_results:
                    type: boolean
                results:
                    $ref: '#/components/schemas/NotificationArray'
                sub_grouped_by: {}
                total_count:
                    type: integer
                    format: int64
                total_pages:
                    type: integer
                    format: int64
                total_results:
                    type: integer
                    format: int64
            required:
                - count
                - next_cursor
                - prev_cursor
                - next_page_results
                - prev_page_results
                - total_count
                - total_results
                - total_pages
                - extra_stats
                - grouped_by
                - sub_grouped_by
                - results
        UnreadCounts:
            type: object
            properties:
                mention_unread_notifications_count:
                    type: integer
                total_unread_notifications_count:
                    type: integer
            required:
                - mention_unread_notifications_count
                - total_unread_notifications_count
    parameters:
        PathSlug:
            name: slug
            in: path
            required: true
            schema:
                type: string
    responses:
        BadRequestError:
            description: Bad Request response.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/NotificationHTTPError_ff189992a65120f5'
        ForbiddenError:
            description: Forbidden response.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/NotificationHTTPError_ff189992a65120f5'
        InternalServerErrorError:
            description: Internal Server Error response.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/NotificationHTTPError_ff189992a65120f5'
        MethodNotAllowedError:
            description: Method Not Allowed response.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/NotificationHTTPError_ff189992a65120f5'
        NotAcceptableError:
            description: Not Acceptable response.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/NotificationHTTPError_ff189992a65120f5'
        NotFoundError:
            description: Not Found response.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/NotificationHTTPError_ff189992a65120f5'
        UnauthorizedError:
            description: Unauthorized response.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/NotificationHTTPError_ff189992a65120f5'
        UnsupportedMediaTypeError:
            description: Unsupported Media Type response.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/NotificationHTTPError_ff189992a65120f5'
    securitySchemes:
        PlaneSessionCookie:
            type: apiKey
            description: Plane session authentication without CSRF enforcement.
            name: session-id
            in: cookie
tags:
    - name: users
