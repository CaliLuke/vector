components:
    parameters:
        HeaderContentType:
            name: Content-Type
            in: header
            schema:
                type: string
    headers:
        ContentTypeHeader:
            schema:
                type: string
        RetryAfterHeader:
            schema:
                type: integer
                format: int64
    requestBodies:
        PostAuthChangePasswordRequestBody:
            content:
                application/json:
                    schema:
                        type: object
                        additionalProperties: true
                application/x-www-form-urlencoded:
                    schema:
                        type: object
                        additionalProperties: true
                multipart/form-data:
                    schema:
                        type: object
                        additionalProperties: true
    responses:
        BadRequestError:
            description: Bad Request response.
            content:
                application/json:
                    schema: {}
        InternalServerErrorError:
            description: Internal Server Error response.
            content:
                application/json:
                    schema: {}
        PostAuthChangePasswordStatus200Response:
            description: OK response.
            headers:
                Content-Type:
                    $ref: '#/components/headers/ContentTypeHeader'
            content:
                application/json:
                    schema: {}
        TooManyRequestsError:
            description: Too Many Requests response.
            headers:
                Retry-After:
                    $ref: '#/components/headers/RetryAfterHeader'
            content:
                application/json:
                    schema: {}
        UnauthorizedError:
            description: Unauthorized response.
            content:
                application/json:
                    schema: {}
        UnsupportedMediaTypeError:
            description: Unsupported Media Type response.
            content:
                application/json:
                    schema: {}
    securitySchemes:
        PlaneSessionCookie:
            type: apiKey
            description: Plane application session cookie authentication.
            name: session-id
            in: cookie
tags:
    - name: account_authentication
      description: Handles account email discovery, password management, and authentication-code requests.
