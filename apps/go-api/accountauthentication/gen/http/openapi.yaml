openapi: 3.1.1
info:
    title: Account Authentication
    version: 1.0.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
servers:
    - url: http://localhost:80
      description: Default server for Account Authentication
paths:
    /auth/change-password/:
        post:
            tags:
                - account_authentication
            summary: change_password account_authentication
            operationId: post_auth_change_password
            parameters:
                - $ref: '#/components/parameters/HeaderContentType'
            requestBody:
                $ref: '#/components/requestBodies/PostAuthChangePasswordRequestBody'
            responses:
                "200":
                    $ref: '#/components/responses/PostAuthChangePasswordStatus200Response'
                "400":
                    $ref: '#/components/responses/BadRequestError'
                    description: 'status_400: Bad Request response.'
                "401":
                    $ref: '#/components/responses/UnauthorizedError'
                    description: 'unauthenticated: Unauthorized response.'
                "415":
                    $ref: '#/components/responses/UnsupportedMediaTypeError'
                    description: 'status_415: Unsupported Media Type response.'
                "429":
                    $ref: '#/components/responses/TooManyRequestsError'
                    description: 'status_429: Too Many Requests response.'
                "500":
                    $ref: '#/components/responses/InternalServerErrorError'
                    description: 'status_500: Internal Server Error response.'
            security:
                - PlaneSessionCookie: []
        x-loom-cors:
            runtime: true
