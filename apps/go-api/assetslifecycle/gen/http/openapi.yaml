                - assets
            x-plane-authentication-classes:
                - plane.authentication.session.BaseSessionAuthentication
            x-plane-authority: route-inventory-and-behavior-fixtures
            x-plane-contract-id: GET /api/assets/v2/static/{asset_id}/
            x-plane-handler: get
            x-plane-permission-classes:
                - rest_framework.permissions.AllowAny
            x-plane-view: plane.app.views.asset.v2.StaticFileAssetEndpoint
