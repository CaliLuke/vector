  # SDK 2 requires API <1.10; keep its shared API within the declared peer range.
  "@opentelemetry/api@^1": 1.9.1
  "@opentelemetry/core@^2": 2.12.0
  "@opentelemetry/resources@^2": 2.12.0
  "@opentelemetry/sdk-trace-base@^2": 2.12.0
