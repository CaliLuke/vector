  # Remove when serve releases a compression pin >=1.8.2; https://github.com/advisories/GHSA-vc2v-76pw-4v95
  "serve>compression": "catalog:"
  # Remove when typography releases a parser pin >=6.1.5; https://github.com/advisories/GHSA-rj75-hqrm-r3gf
  "@tailwindcss/typography>postcss-selector-parser": 6.1.5

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  turbo: true
  sharp: false

# Remove when tiptap-markdown declares its runtime @tiptap/pm requirement; see https://github.com/aguingand/tiptap-markdown/issues/88
packageExtensions:
  tiptap-markdown@0.9.0:
    peerDependencies:
      "@tiptap/pm": "^3.0.1"

