overrides:
  # Form's devtools reconnect timer delays Node process exit; https://github.com/TanStack/form/issues/2132
  # Remove after a Form release includes https://github.com/TanStack/form/pull/2410 (event-client >=0.5.0).
  "@tanstack/form-core@1.33.5>@tanstack/devtools-event-client": 0.5.0
  # 3.0.10 drops first text when block IDs append a transaction; https://github.com/ueberdosis/tiptap/issues/8584
  # Remove after an upstream release passes the unique-id/collaboration regression.
  "@tiptap/y-tiptap": 3.0.9
  # Tiptap's server API supports 21, but its peer range lags; https://github.com/ueberdosis/tiptap/issues/8540
  # Remove when @tiptap/html accepts happy-dom >=21.0.4 (GHSA-834v-8h66-3h79).
  "@tiptap/html>happy-dom": 21.0.4
  "mdast-util-to-hast@^13": 13.2.1
  "valibot@^1": 1.5.0
  "brace-expansion@^5": 5.0.12
  "nanoid@^3": 3.3.20
  "esbuild@^0": 0.28.2
  "@babel/core": 7.29.7
  "@babel/helpers": 7.29.10
